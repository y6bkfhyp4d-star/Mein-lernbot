
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#11111a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NERYX">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>NERYX – Persönliche KI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #11111a;
      --sidebar: #171722;
      --panel: #20202e;
      --panel2: #29293b;
      --text: #f5f3ff;
      --muted: #a5a2b8;
      --line: #343348;
      --accent: #a78bfa;
      --accent2: #8b5cf6;
      --user: #6941c6;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background: var(--bg);
    }

    /* SIDEBAR */

    #drawer {
      width: 275px;
      min-width: 275px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 19px 13px;
      overflow-y: auto;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 8px 20px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #a78bfa, #7044d6);
      color: white;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 5px 20px rgba(139, 92, 246, .25);
    }

    .brand strong {
      display: block;
      font-size: 16px;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .side-label {
      padding: 13px 10px 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .side-button {
      width: 100%;
      min-height: 43px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 13px;
      transition: background .18s, border-color .18s;
    }

    .side-button:hover {
      background: var(--panel2);
    }

    .side-button.active {
      background: #30264c;
      border-color: #59428b;
      color: #dfd3ff;
    }

    .side-icon {
      width: 22px;
      flex: 0 0 22px;
      text-align: center;
      font-size: 17px;
    }

    .side-spacer {
      flex: 1;
      min-height: 15px;
    }

    .sidebar-footer {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    /* MOBILE SIDEBAR BACKDROP */

    #sidebar-backdrop {
      display: none;
    }

    /* MAIN */

    #main {
      flex: 1;
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(139, 92, 246, .10),
          transparent 55%
        ),
        var(--bg);
    }

    header {
      min-height: 68px;
      height: 68px;
      flex: 0 0 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 23px;
      border-bottom: 1px solid var(--line);
      background: rgba(23, 23, 34, .92);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .header-title strong {
      display: block;
      font-size: 15px;
    }

    .header-title small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    #menu {
      width: 41px;
      height: 41px;
      flex: 0 0 41px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 20px;
    }

    #menu:hover {
      background: var(--panel2);
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #a8e6bd;
      font-size: 11px;
      white-space: nowrap;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 9px rgba(74, 222, 128, .45);
    }

    /* CHAT */

    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 25px max(18px, calc((100% - 850px) / 2));
    }

    .msg {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
    }

    .bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 5px;
    }

    /* SUGGESTIONS */

    #suggestions {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      padding: 10px 16px;
    }

    #suggestions button {
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: .18s;
    }

    #suggestions button:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* INPUT AREA */

    .input-area {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 9px 18px 5px;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .15);
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    #input::placeholder {
      color: #858197;
    }

    #send {
      min-height: 43px;
      padding: 10px 19px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #a78bfa, #8053dc);
      color: white;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: filter .18s, transform .18s;
    }

    #send:hover {
      filter: brightness(1.12);
    }

    #send:active {
      transform: scale(.97);
    }

    #status {
      padding: 7px 10px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 10px;
    }

    /* TABLET & MOBILE */

    @media (max-width: 760px) {
      #drawer {
        position: fixed;
        top: env(safe-area-inset-top);
        bottom: 0;
        left: 0;
        width: 285px;
        min-width: 0;
        max-width: 85vw;
        height: auto;
        transform: translateX(-105%);
        transition: transform .25s ease;
        box-shadow: 10px 0 35px rgba(0, 0, 0, .35);
      }

      #drawer.open {
        transform: translateX(0);
      }

      #sidebar-backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, .62);
      }

      header {
        padding: 0 13px;
      }

      #log {
        padding: 18px 13px;
      }

      .msg {
        max-width: 92%;
      }

      #suggestions {
        justify-content: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 8px 12px;
        scrollbar-width: none;
      }

      #suggestions::-webkit-scrollbar {
        display: none;
      }

      .input-area {
        padding: 7px 10px 2px;
      }

      #bar {
        gap: 6px;
      }

      #input {
        padding: 11px 9px;
        font-size: 16px;
      }

      #send {
        padding: 10px 14px;
      }
    }

    @media (max-width: 380px) {
      .online {
        display: none;
      }

      .header-title small {
        font-size: 10px;
      }

      #send {
        padding: 10px 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    /* NERYX Navigation: klare Gliederung, konsistente Symbole, dezenter Glow */
    #drawer {background:linear-gradient(165deg,#1c1730 0%,#171722 48%,#13121e 100%);border-right-color:rgba(167,139,250,.18)}
    .brand {margin:0 0 8px;padding:12px 10px 21px;border-bottom:1px solid rgba(167,139,250,.16)}

    .side-button {min-height:46px;border-radius:14px;gap:12px;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
    .side-button:hover {background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.12)}
    .side-button:active {transform:scale(.975)}
    .side-button.active {background:linear-gradient(90deg,rgba(139,92,246,.32),rgba(139,92,246,.10));border-color:rgba(167,139,250,.36);box-shadow:inset 3px 0 #a78bfa}
    .side-icon {width:23px;flex-basis:23px;display:grid;place-items:center;color:#bda9ef}
    .side-icon svg {display:block}
    .side-button.active .side-icon {color:#eee5ff}
    #sidebar-backdrop.open {backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
    @media(max-width:760px){#drawer{width:304px;max-width:88vw;box-shadow:14px 0 55px rgba(0,0,0,.55)}}
    @media(prefers-reduced-motion:reduce){.side-button{transition:none!important}}
    /* NERYX – energiesparende Animationen, respektiert Bewegungseinstellungen */
    .brand-icon {animation:neryxGlow 4s ease-in-out infinite}
    .online-dot {animation:neryxPulse 2.6s ease-in-out infinite}
    @keyframes neryxGlow {0%,100%{box-shadow:0 0 6px rgba(167,139,250,.18)}50%{box-shadow:0 0 21px rgba(167,139,250,.48)}}
    @keyframes neryxPulse {0%,100%{opacity:1}50%{opacity:.5}}
    @media (prefers-reduced-motion:reduce) {
      .brand-icon,.online-dot {animation:none!important}
    }
  </style>
</head>

<!-- MOBILE SIDEBAR -->
<script>
(() => {
  "use strict";

  const menu = document.getElementById("menu");
  const drawer = document.getElementById("drawer");
  const backdrop = document.getElementById("sidebar-backdrop");

  if (!menu || !drawer || !backdrop) return;

  function closeMenu() {
    drawer.classList.remove("open");
    backdrop.classList.remove("open");
    menu.setAttribute("aria-expanded", "false");
  }

  function toggleMenu() {
    const isOpen = drawer.classList.toggle("open");
    backdrop.classList.toggle("open", isOpen);
    menu.setAttribute("aria-expanded", String(isOpen));
  }

  menu.addEventListener("click", toggleMenu);
  backdrop.addEventListener("click", closeMenu);

  drawer.addEventListener("click", event => {
    if (
      event.target.closest("button") &&
      window.matchMedia("(max-width: 760px)").matches
    ) {
      closeMenu();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeMenu();
  });

  window.addEventListener("resize", () => {
    if (window.matchMedia("(min-width: 761px)").matches) {
      closeMenu();
    }
  });
})();
</script>

(() => {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', {
        scope: './', updateViaCache: 'none'
      });
      registration.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) registration.update().catch(() => {});
      });
    } catch (error) {
      console.warn('NERYX: Offline-Updates nicht verfügbar', error);
    }
  }, {once:true});
})();
</script>
