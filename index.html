<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20201e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mein LernBot">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Mein LernBot</title>
  <style>
    :root{color-scheme:dark;--bg:#171715;--panel:#22221f;--text:#f4f1e9;--muted:#aaa69c;--line:#3b3934;--accent:#d46d4c;--user:#a94f36}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#app{height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column}
    header{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}
    header strong{font-size:18px}header small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
    #menu{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:18px}
    #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
    .msg{max-width:86%;padding:11px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42}
    .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
    .user{align-self:flex-end;background:var(--user);color:white;border-bottom-right-radius:5px}
    #suggestions{display:flex;gap:7px;overflow:auto;padding:4px 14px 10px}
    #suggestions button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 12px}
    #bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
    #input{min-width:0;flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:24px;padding:12px 15px;font:inherit;outline:none}
    #send{border:0;background:var(--accent);color:white;border-radius:24px;padding:0 19px;font-weight:600}
    #drawer{display:none;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
    #drawer.open{display:flex}#drawer button{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:12px}
    #status{font-size:11px;color:var(--muted);padding:0 16px 5px;background:var(--panel)}
  </style>
</head>
<body>
<div id="app">
  <header><div><strong>Mein LernBot</strong><small>Dein lokaler, lernender Chatbot</small></div><button id="menu" aria-label="Menü">☰</button></header>
  <nav id="drawer">
    <button data-cmd="hilfe">Hilfe</button><button data-cmd="was weißt du?">Mein Wissen</button>
    <button data-cmd="verlauf löschen">Chat leeren</button><button data-cmd="export">Wissen exportieren</button>
    <button data-cmd="import">Wissen importieren</button><button data-cmd="theme">Darstellung wechseln</button>
  </nav>
  <main id="log" aria-live="polite"></main>
  <div id="suggestions"><button data-msg="Hilfe">Hilfe</button><button data-msg="Notfall">Notfall</button><button data-msg="Was weißt du?">Was weißt du?</button></div>
  <div id="status">Offline-fähig · Daten bleiben auf diesem Gerät</div>
  <form id="bar"><input id="input" placeholder="Schreib etwas …" autocomplete="off"><button id="send">Senden</button></form>
</div>
<script src="app.js"></script>
</body>
</html>
