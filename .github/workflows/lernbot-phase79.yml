
name: LernBot 7.0 - Qualitaetspruefung 7.9

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lernbot-phase79.yml"

permissions:
  contents: write

concurrency:
  group: lernbot-phase79
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Neue Faktenkandidaten aus passenden Recherchetreffern extrahieren
        run: python3 evolution/phase79/research79.py

      - name: Tests
        run: python3 -m unittest discover -s evolution/phase79 -p 'test_research79.py'

      - name: Extraktionsbericht speichern
        run: |
          if ! git diff --quiet -- evolution/phase79/research79.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evolution/phase79/research79.json
            git commit -m "LernBot 7.9: Extraktionsbericht aktualisieren"
            git pull --rebase
            git push
          else
            echo "Keine Änderungen am Extraktionsbericht."
          fi
