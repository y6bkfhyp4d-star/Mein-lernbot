# GENESIS X phase 1 — immutable-path policy for auto-generated proposal PRs.
# This workflow is defense in depth. It does NOT replace branch ruleset or human review.
name: NERYX GENESIS X candidate policy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-paths:
    name: genesis-candidate-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read reviewed PR merge tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require auto-candidate proposals to change only candidate data
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Manual policy smoke: no PR head to inspect"
            exit 0
          fi
          if [[ "$HEAD_REF" != neryx/auto/* ]]; then
            echo "Ordinary PR: use other CI + required human review for sensitive sources"
            exit 0
          fi
          echo "Checking proposed generated changes from $HEAD_REF"
          python3 - "$BASE_SHA" <<'PY'
          import pathlib, re, subprocess, sys
          base = sys.argv[1]
          if not re.fullmatch(r"[a-f0-9]{40}", base):
              raise SystemExit("DENIED: invalid base SHA")
          changes = subprocess.check_output([
              "git", "diff", "--name-status", "-z", "--no-renames", base, "HEAD"
          ]).split(b"\0")
          if changes[-1] != b"":
              raise SystemExit("DENIED: malformed Git diff")
          changes.pop()
          if not changes or len(changes) % 2:
              raise SystemExit("DENIED: empty/malformed auto-candidate diff")
          allowed = re.compile(r"(?:candidates|eval/candidates)/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.json")
          for raw_status, raw_path in zip(changes[::2], changes[1::2]):
              status = raw_status.decode("ascii", "strict")
              path = raw_path.decode("utf-8", "strict")
              if status not in ("A", "M") or not allowed.fullmatch(path):
                  raise SystemExit(f"DENIED: prohibited candidate change: {status} {path!r}")
          print(f"PASS: {len(changes)//2} candidate JSON paths, no deletes/renames/code")
          PY
          echo "Paths allowed for inert JSON storage only; NOT permission to execute or merge."
