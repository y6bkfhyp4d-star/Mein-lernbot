# GENESIS X phase 1 — immutable-path policy for auto-generated proposal PRs.
# This workflow is defense in depth. It does NOT replace branch ruleset or human review.
name: NERYX GENESIS X candidate policy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-paths:
    name: genesis-candidate-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read reviewed PR merge tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require auto-candidate proposals to change only candidate data
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Manual policy smoke: no PR head to inspect"
            exit 0
          fi
          if [[ "$HEAD_REF" != neryx/auto/* ]]; then
            echo "Ordinary PR: use other CI + required human review for sensitive sources"
            exit 0
          fi
          echo "Checking proposed generated changes from $HEAD_REF"
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" HEAD > "$RUNNER_TEMP/genesis-files.txt"
          if [[ ! -s "$RUNNER_TEMP/genesis-files.txt" ]]; then
            echo "Empty auto-candidate proposal" >&2; exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              candidates/*|eval/candidates/*) ;;
              *) echo "DENIED: prohibited path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/genesis-files.txt"
          echo "Paths allowed for storage of candidate text only; NOT permission to execute or merge."
