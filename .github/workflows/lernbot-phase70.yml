name: LernBot 7.0 – automatisches Wissen (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 2,8,14,20 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase70
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase70
      REPORT_FILES: evolution/phase70/knowledge.json
    steps:
      - name: Vertrauenswuerdigen Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zugelassene JSON-Forschungsdaten einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Tests des main-Generators
        run: python -m unittest discover -s evolution/phase70 -p 'test_*.py' -v
      - name: Neue Quellen mit main-Code einsammeln
        run: python evolution/phase70/engine.py
      - name: Nur Bericht auf Review-Branch veroeffentlichen
        run: bash .github/scripts/research-review-branch.sh publish
