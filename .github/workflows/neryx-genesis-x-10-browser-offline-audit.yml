name: NERYX GENESIS X 1.0 real-browser offline audit
on:
  pull_request:
    branches: [neryx/genesis-x-10-stack-integration-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-genesis-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser runtime
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run isolated GENESIS X without an available origin
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/genesis-x-browser-offline-smoke.mjs
  existing-app-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser runtime
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Ensure existing NERYX offline app still starts unchanged
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/browser-offline-smoke.mjs
  protect-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No production or frozen changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/files.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json)$' /tmp/files.txt; then
            echo 'Protected file changed'; exit 1
          fi
