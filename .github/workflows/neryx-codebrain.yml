name: NERYX CodeBrain 1.0 read-only manual review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR targeting main'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  codebrain-manual:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Test trusted scanner without external API
        run: node --test eval/tests/codebrain.test.mjs
      - name: Scan PR source as inert Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/neryx-codebrain.mjs
