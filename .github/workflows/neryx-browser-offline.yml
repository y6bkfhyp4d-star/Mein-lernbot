name: NERYX real-browser offline smoke
on:
  push:
    branches:
      - neryx/s2-retrieval-scoring
    paths:
      - 'eval/browser-offline-smoke.mjs'
      - '.github/workflows/neryx-browser-offline.yml'
      - 'sw.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real-browser offline smoke
        run: node eval/browser-offline-smoke.mjs
