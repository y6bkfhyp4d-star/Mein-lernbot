name: NERYX - Grounding Dummy CI
on:
  push:
    branches:
      - neryx/s2-retrieval-scoring
    paths:
      - 'eval/grounding-score.mjs'
      - 'eval/tests/grounding-score.test.mjs'
      - '.github/workflows/neryx-grounding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservative grounding against synthetic dummy claims
        run: node --test eval/tests/grounding-score.test.mjs
