name: NERYX GENESIS X 1.0 audit ledger session
on:
  pull_request:
    branches: [neryx/genesis-x-10-h-trusted-selection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All GENESIS X regression, attack and ledger tests
        run: node --test eval/tests/genesis-x*.test.mjs
      - name: App and Frozen remain untouched
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json)$' /tmp/changed.txt; then
            echo "Protected file changed"; exit 1
          fi
