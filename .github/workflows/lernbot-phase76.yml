name: LernBot 7.0 – Quellenabgleich 7.6 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "29 2,8,14,20 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase76
  cancel-in-progress: false
jobs:
  crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase76
      REPORT_FILES: evolution/phase76/review76.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Quellen automatisch abgleichen
        run: python3 evolution/phase76/check76.py
      - name: Automatische Tests
        run: python3 -m unittest discover -s evolution/phase76 -p 'test_check76.py'
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
