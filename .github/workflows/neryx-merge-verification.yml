name: NERYX merge candidate verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm pull request merge candidate
        if: github.event_name == 'pull_request'
        run: |
          test "$GITHUB_REF" = "refs/pull/${{ github.event.pull_request.number }}/merge"
          echo "Testing synthetic merge commit $(git rev-parse HEAD)"
      - name: Preserve main-only research and audit files
        run: |
          for path in \
            evolution/phase70/knowledge.json \
            evolution/phase710/research710.json \
            evolution/phase711/research711.json \
            evolution/phase712/audit712.json \
            evolution/phase712/research711.json \
            evolution/phase713/audit713.json \
            evolution/phase713/research711.json \
            evolution/phase76/review76.json \
            evolution/phase77/research77.json \
            evolution/phase78/research78.json \
            evolution/phase79/research79.json; do
            test -s "$path" || { echo "Missing main-only file: $path"; exit 1; }
          done
      - name: Verify all corpus and evaluation tests
        run: node --test eval/tests/*.test.mjs eval/tests/corpus/*.test.mjs
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser dependencies
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify merged app offline in real browser
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/browser-offline-smoke.mjs

  solo-token-readonly-negative:
    # Only PR #91; no checkout, no write token, no secret or token output.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 91
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Confirm read-only Actions token cannot create Git ref
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          api = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "GENESIS-X-solo-readonly-permission-negative",
          }
          with urllib.request.urlopen(urllib.request.Request(
              f"{api}/repos/{repo}", headers=headers), timeout=15) as response:
              assert response.status == 200, "API authentication unavailable"
          # Impossible Git object SHA: even a mistakenly writable token
          # cannot actually create this branch.
          payload = json.dumps({
              "ref": "refs/heads/neryx/solo-permission-probe-" + os.environ["RUN_ID"],
              "sha": "0" * 40,
          }).encode()
          request = urllib.request.Request(
              f"{api}/repos/{repo}/git/refs", data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=15):
                  raise RuntimeError("Write unexpectedly accepted")
          except urllib.error.HTTPError as exc:
              print("Read-only Actions token write probe HTTP", exc.code)
              if exc.code != 403:
                  raise RuntimeError("Permission denial not proven") from exc
              print("PASS: GitHub refused Git-ref creation by read-only Actions token")
          # Also probe the Contents write API on this draft branch. Bogus
          # current file SHA ensures GitHub cannot accept an update,
          # even if unexpectedly granted write privileges.
          import base64, urllib.parse
          file_path = "docs/GENESIS_X_SOLO_OWNER_MODE.md"
          target = (
              f"{api}/repos/{repo}/contents/"
              + urllib.parse.quote(file_path, safe="/")
          )
          payload = json.dumps({
              "message": "never accepted: read-only permissions test",
              "content": base64.b64encode(b"unreachable\n").decode("ascii"),
              "sha": "0" * 40,
              "branch": os.environ["PR_HEAD_REF"],
          }).encode()
          request = urllib.request.Request(
              target, data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT")
          try:
              with urllib.request.urlopen(request, timeout=15):
                  raise RuntimeError("Contents write unexpectedly accepted")
          except urllib.error.HTTPError as exc:
              print("Read-only Actions token contents probe HTTP", exc.code)
              if exc.code != 403:
                  raise RuntimeError("Contents permission denial not proven") from exc
              print("PASS: GitHub refused file update by read-only Actions token")
          PY
