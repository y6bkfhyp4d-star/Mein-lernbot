name: NERYX learning feedback smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/neryx-smoke.test.mjs'
      - 'modules/learning-lab.js'
      - '.github/workflows/neryx-learning-feedback-assertion.yml'
permissions:
  contents: read
jobs:
  learning-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify feedback and ranked strategy outcome
        run: |
          node --test --test-name-pattern="Lernlabor: Rückmeldung ändert" tests/neryx-smoke.test.mjs
