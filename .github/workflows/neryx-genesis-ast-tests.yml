name: GENESIS X AST Analyzer 2.1 tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genesis-ast:
    name: genesis-ast
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated pinned AST parser (no scripts)
        working-directory: eval/genesis-ast
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test AST analysis in read-only mode
        working-directory: eval/genesis-ast
        run: npm test
      - name: AST smoke on existing source (no writeback)
        working-directory: eval/genesis-ast
        run: node analyzer.mjs analyzer.mjs > /dev/null
      - name: Verify OS isolation prerequisites with synthetic probe only
        timeout-minutes: 2
        run: |
          set -euo pipefail
          image='alpine@sha256:9db2934886712d877c932e07249c75a59e6ca27adfbccc05261987a17bef2d63'
          docker pull --platform linux/amd64 "$image"
          name="neryx-isolation-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 30s docker run --name "$name" --rm --pull never --platform linux/amd64 \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
            "$image" /bin/sh -ec '
              test "$(id -u)" = 65534
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              test "$(ls /sys/class/net)" = lo
              test ! -e /var/run/docker.sock
              test ! -d /home/runner
              test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
              if touch /tmp/../isolation-probe 2>/dev/null; then exit 1; fi
              grep -E "^([^ ]+ ){5}ro(,| )" /proc/self/mountinfo | grep -q " / / "
              test "$(cat /sys/fs/cgroup/memory.max)" = 67108864
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/pids.max)" = 16
              test "$(cat /sys/fs/cgroup/cpu.max)" = "50000 100000"
              touch /tmp/isolation-probe
              rm /tmp/isolation-probe
              echo NERYX_SYNTHETIC_ISOLATION_PROBE_OK
            '
      - name: Verify actual Python parser in isolated synthetic cases
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20'
          docker pull --platform linux/amd64 "$image"
          name="neryx-python-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          helper="$PWD/.github/scripts/neryx-python-syntax.py"
          parse() {
            timeout --kill-after=5s 15s docker run -i --name "$name" --rm --pull never --platform linux/amd64 \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --mount "type=bind,source=$helper,target=/parser.py,readonly" \
              --entrypoint /usr/local/bin/python3 "$image" -I -S /parser.py
          }
          test "$(printf 'raise RuntimeError("MUST_NOT_EXECUTE")\n' | parse)" = '{"parsed":true,"line":null}'
          test "$(printf 'def broken(:\n' | parse)" = '{"parsed":false,"line":1}'
          python3 -c 'import sys; sys.stdout.buffer.write(b"x=1\n#"+b"\xc3\xa4"*34997+b" ")' > "$RUNNER_TEMP/neryx-python-boundary.txt"
          test "$(wc -c < "$RUNNER_TEMP/neryx-python-boundary.txt")" = 70000
          test "$(parse < "$RUNNER_TEMP/neryx-python-boundary.txt")" = '{"parsed":true,"line":null}'
          printf ' ' >> "$RUNNER_TEMP/neryx-python-boundary.txt"
          if parse < "$RUNNER_TEMP/neryx-python-boundary.txt" > "$RUNNER_TEMP/neryx-python-rejected.txt" 2>/dev/null; then
            echo 'Oversized parser input unexpectedly accepted' >&2
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/neryx-python-rejected.txt"
          rm -f "$RUNNER_TEMP/neryx-python-boundary.txt" "$RUNNER_TEMP/neryx-python-rejected.txt"
          echo NERYX_ISOLATED_PYTHON_SYNTHETIC_OK
      - name: Verify actual YAML parser in isolated synthetic cases
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='ruby@sha256:a9ec8f8f22bdcfff3747e9080fedce2b86f487bdec856ca56464ec63603e49c9'
          docker pull --platform linux/amd64 "$image"
          name="neryx-yaml-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          helper="$PWD/.github/scripts/neryx-yaml-syntax.rb"
          parse() {
            timeout --kill-after=5s 15s docker run -i --name "$name" --rm --pull never --platform linux/amd64 \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --mount "type=bind,source=$helper,target=/parser.rb,readonly" \
              --entrypoint /usr/local/bin/ruby "$image" -W0 /parser.rb
          }
          # Label each synthetic case and validate the output contract independently.
          check() {
            local label="$1" expected="$2" result
            if ! result="$(parse)"; then
              echo "YAML probe failed to execute: $label" >&2
              return 1
            fi
            if ! printf '%s' "$result" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert isinstance(data, dict) and set(data) == {"parsed", "line"}
          if sys.argv[1] == "valid":
              assert data["parsed"] is True and data["line"] is None
          else:
              assert data["parsed"] is False and type(data["line"]) is int and data["line"] >= 1
          ' "$expected"; then
              echo "YAML result contract failed: $label" >&2
              return 1
            fi
            echo "YAML probe passed: $label"
          }
          printf 'key: value\n' | check valid-document valid
          printf '%s\n' '--- !ruby/object:NeryxNonexistentSyntheticClass' 'value: 1' | check inert-object-tag valid
          printf 'key: [\n' | check invalid-document invalid
          python3 -c 'import sys; sys.stdout.buffer.write(b"x: 1\n#"+b"\xc3\xa4"*34997)' > "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          test "$(wc -c < "$RUNNER_TEMP/neryx-yaml-boundary.txt")" = 70000
          check exact-byte-boundary valid < "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          printf ' ' >> "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          set +e
          parse < "$RUNNER_TEMP/neryx-yaml-boundary.txt" > "$RUNNER_TEMP/neryx-yaml-rejected.txt" 2>"$RUNNER_TEMP/neryx-yaml-rejected.err"
          rc=$?
          set -e
          echo "YAML oversized-input exit status: $rc"
          test "$rc" = 1
          test ! -s "$RUNNER_TEMP/neryx-yaml-rejected.txt"
          grep -Fq 'input-limit' "$RUNNER_TEMP/neryx-yaml-rejected.err"
          rm -f "$RUNNER_TEMP"/neryx-yaml-boundary.txt "$RUNNER_TEMP"/neryx-yaml-rejected.{txt,err}
          echo NERYX_ISOLATED_YAML_SYNTHETIC_OK
      - name: Verify actual Acorn worker in isolated synthetic cases
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c'
          docker pull --platform linux/amd64 "$image"
          name="neryx-js-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-js.XXXXXX")"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; rm -rf -- "$stage"' EXIT
          chmod 755 "$stage"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          parse() {
            timeout --kill-after=5s 15s docker run -i --name "$name" --rm --pull never --platform linux/amd64 \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65534:65534 --memory 192m --memory-swap 192m --cpus 0.5 --pids-limit 32 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --mount "type=bind,source=$stage,target=/parser,readonly" \
              --entrypoint /usr/local/bin/node "$image" --max-old-space-size=96 /parser/codebrain-worker.mjs
          }
          check() {
            local label="$1" expected="$2" result
            result="$(parse)"
            printf '%s' "$result" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert set(data) == {"parsed", "findings"}
          assert type(data["parsed"]) is bool and isinstance(data["findings"], list)
          assert len(data["findings"]) <= 41
          for f in data["findings"]:
              assert set(f) == {"rule", "line"} and type(f["line"]) is int and f["line"] >= 1
          expected = sys.argv[1]
          assert data["parsed"] is (expected != "invalid")
          if expected == "invalid":
              assert len(data["findings"]) == 1 and data["findings"][0]["rule"] == "AST000"
          elif expected == "dynamic":
              assert any(f["rule"] == "AST001" for f in data["findings"])
          else:
              assert not data["findings"]
          ' "$expected"
            echo "Acorn probe passed: $label"
          }
          printf '%s' '{"path":"sample.mjs","source":"export const x = 1; throw new Error(\"MUST_NOT_EXECUTE\");"}' | check inert-module valid
          printf '%s' '{"path":"sample.mjs","source":"eval(\"synthetic\");"}' | check dynamic-warning dynamic
          printf '%s' '{"path":"sample.mjs","source":"export const = ;"}' | check malformed-module invalid
          printf '%s' '{"path":"sample.cjs","source":"return;"}' | check commonjs-return valid
          printf '%s' '{"path":"sample.mjs","source":"return;"}' | check module-return invalid
          python3 -c 'import json; print(json.dumps({"path":"sample.mjs","source":"//"+"ä"*34999},ensure_ascii=False))' | check exact-byte-boundary valid
          python3 -c 'import json; print(json.dumps({"path":"sample.mjs","source":"//"+"ä"*34999+" "},ensure_ascii=False))' > "$stage-input.json"
          set +e
          parse < "$stage-input.json" > "$stage-output.json" 2>"$stage-error.txt"
          rc=$?
          set -e
          test "$rc" = 1
          test ! -s "$stage-output.json"
          grep -Fxq 'AST worker failed' "$stage-error.txt"
          rm -f "$stage-input.json" "$stage-output.json" "$stage-error.txt"
          echo NERYX_ISOLATED_ACORN_SYNTHETIC_OK
      - name: Compare isolated and host parser results on fixed synthetic corpus
        timeout-minutes: 3
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-parity.XXXXXX")"
          chmod 755 "$stage"
          name="neryx-parity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; rm -rf -- "$stage"' EXIT
          cp .github/scripts/{neryx-python-syntax.py,neryx-yaml-syntax.rb} "$stage/"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          STAGE="$stage" CONTAINER_NAME="$name" python3 - <<'PY'
          import json, os, subprocess
          stage = os.environ["STAGE"]
          name = os.environ["CONTAINER_NAME"]
          images = {
              "python": "python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20",
              "yaml": "ruby@sha256:a9ec8f8f22bdcfff3747e9080fedce2b86f487bdec856ca56464ec63603e49c9",
              "js": "node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c",
          }
          commands = {
              "python": ("python3", "/usr/local/bin/python3", ["-I", "-S", "neryx-python-syntax.py"]),
              "yaml": ("ruby", "/usr/local/bin/ruby", ["-W0", "neryx-yaml-syntax.rb"]),
              "js": ("node", "/usr/local/bin/node", ["--max-old-space-size=96", "codebrain-worker.mjs"]),
          }
          def js(path, source):
              return json.dumps({"path": path, "source": source}, ensure_ascii=False).encode()
          cases = [
              ("python", "empty", b"", True),
              ("python", "unicode", "name = 'Grüße'\n".encode(), True),
              ("python", "inert", b"raise RuntimeError('synthetic')", True),
              ("python", "invalid", b"def broken(:", False),
              ("python", "oversize", b"#" + b"x"*70000, None),
              ("yaml", "empty", b"", True),
              ("yaml", "unicode", "name: Grüße\n".encode(), True),
              ("yaml", "tag", b"--- !ruby/object:NeryxSynthetic\nx: 1", True),
              ("yaml", "invalid", b"key: [", False),
              ("yaml", "oversize", b"#" + b"x"*70000, None),
              ("js", "empty", js("a.mjs", ""), True),
              ("js", "module", js("a.mjs", "export const x = 1;"), True),
              ("js", "commonjs", js("a.cjs", "return;"), True),
              ("js", "warning", js("a.mjs", "eval('synthetic');"), True),
              ("js", "invalid", js("a.mjs", "export const = ;"), False),
              ("js", "unicode-boundary", js("a.mjs", "//" + "ä"*34999), True),
              ("js", "oversize", js("a.mjs", "//" + "ä"*34999 + " "), None),
          ]
          def run(args, data):
              return subprocess.run(args, input=data, stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, timeout=20, cwd=stage,
                                    env={"PATH": os.environ["PATH"], "LANG": "C.UTF-8"})
          for language, label, data, expected in cases:
              host, entry, args = commands[language]
              memory, pids = ("192m", "32") if language == "js" else ("64m", "16")
              docker = ["docker", "run", "-i", "--rm", "--name", name,
                        "--pull", "never", "--platform", "linux/amd64",
                        "--network", "none", "--read-only", "--cap-drop", "ALL",
                        "--security-opt", "no-new-privileges:true", "--user", "65534:65534",
                        "--memory", memory, "--memory-swap", memory, "--cpus", "0.5",
                        "--pids-limit", pids, "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=1m",
                        "--mount", f"type=bind,source={stage},target=/parser,readonly",
                        "--workdir", "/parser", "--entrypoint", entry, images[language], *args]
              try:
                  a, b = run([host, *args], data), run(docker, data)
                  if expected is None:
                      assert a.returncode == b.returncode == 1
                      assert not a.stdout and not b.stdout
                      marker = b"AST worker failed" if language == "js" else b"input-limit"
                      assert marker in a.stderr and marker in b.stderr
                  else:
                      assert a.returncode == b.returncode == 0
                      x, y = json.loads(a.stdout), json.loads(b.stdout)
                      assert x["parsed"] is y["parsed"] is expected
                      if language == "js":
                          assert set(x) == set(y) == {"parsed", "findings"}
                          assert x == y
                          if label == "warning":
                              assert any(f["rule"] == "AST001" for f in x["findings"])
                          if not expected:
                              assert len(x["findings"]) == 1 and x["findings"][0]["rule"] == "AST000"
                      else:
                          assert set(x) == set(y) == {"parsed", "line"}
                          if expected:
                              assert x["line"] is y["line"] is None
                          else:
                              assert all(type(v["line"]) is int and v["line"] >= 1 for v in (x,y))
                              if x["line"] != y["line"]:
                                  print(f"PARITY_POSITION_DIFFERENCE {language}/{label}: host={x['line']} container={y['line']}", flush=True)
                  print(f"PARITY_CASE_OK {language}/{label}", flush=True)
              except Exception:
                  raise SystemExit(f"PARITY_CASE_FAILED {language}/{label}") from None
          print(f"NERYX_PARSER_PARITY_OK cases={len(cases)}", flush=True)
          PY
      - name: Verify bounded resource enforcement and container cleanup
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20'
          name="neryx-resource-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          common=(--pull never --platform linux/amd64 --network none --read-only
            --cap-drop ALL --security-opt no-new-privileges:true --user 65534:65534
            --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m
            --entrypoint /usr/local/bin/python3)
          # Read the kernel cgroup counter while the container is still alive.
          # Docker's post-exit OOMKilled metadata was intermittently false.
          timeout --kill-after=5s 30s docker run --rm --name "$name" "${common[@]}" "$image" -I -S -c '
          import subprocess, sys
          def events():
              with open("/sys/fs/cgroup/memory.events", encoding="ascii") as f:
                  return {k:int(v) for k,v in (line.split() for line in f)}
          with open("/sys/fs/cgroup/memory.max", encoding="ascii") as f:
              assert f.read().strip() == "67108864"
          before=events()
          child=subprocess.run([sys.executable,"-I","-S","-c","x=bytearray(96*1024*1024); print(123)"],capture_output=True,timeout=15)
          after=events()
          print("Memory probe child returncode:",child.returncode,flush=True)
          print("Memory probe kernel oom_kill delta:",after["oom_kill"]-before["oom_kill"],flush=True)
          assert child.returncode == -9
          assert after["oom_kill"] > before["oom_kill"]
          assert not child.stdout
          '
          echo NERYX_RESOURCE_MEMORY_OK
          docker run --rm --name "$name" "${common[@]}" "$image" -I -S -c '
          import errno, subprocess, sys
          children = []
          denied = False
          try:
              for _ in range(20):
                  try:
                      children.append(subprocess.Popen([sys.executable, "-I", "-S", "-c", "import time; time.sleep(10)"]))
                  except OSError as error:
                      assert error.errno == errno.EAGAIN
                      denied = True
                      break
              assert denied and 0 < len(children) < 16
          finally:
              for child in children:
                  if child.poll() is None:
                      child.kill()
              for child in children:
                  child.wait(timeout=3)
          '
          echo NERYX_RESOURCE_PIDS_OK
          docker run -d --name "$name" "${common[@]}" "$image" -I -S -c 'import signal,time; signal.signal(signal.SIGTERM,signal.SIG_IGN); print("READY",flush=True); time.sleep(60)'
          ready=0
          for attempt in $(seq 1 30); do
            if docker logs "$name" 2>&1 | grep -Fxq READY; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = 1
          set +e
          timeout --kill-after=2s 2s docker wait "$name" >/dev/null
          rc=$?
          set -e
          test "$rc" = 124
          timeout --kill-after=2s 10s docker rm -f "$name" >/dev/null
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo 'Container still exists after cleanup' >&2
            exit 1
          fi
          echo NERYX_RESOURCE_TIMEOUT_CLEANUP_OK
          echo NERYX_SYNTHETIC_RESOURCE_TESTS_OK
      - name: Verify candidate sandbox launcher contract
        run: node --test eval/tests/codebrain-sandbox.test.mjs
      - name: Exercise candidate launcher with actual Docker parsers
        timeout-minutes: 3
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-launcher.XXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          chmod 755 "$stage"
          cp .github/scripts/{neryx-python-syntax.py,neryx-yaml-syntax.rb} "$stage/"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          STAGE="$stage" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {renameSync} from 'node:fs';
          import {join} from 'node:path';
          import {createSandboxParsers} from './.github/scripts/neryx-sandbox.mjs';
          const stage=process.env.STAGE;
          const list=()=>execFileSync('/usr/bin/docker',['ps','-a','--filter','name=neryx-parser-','--format','{{.Names}}'],{encoding:'utf8',timeout:10000}).trim();
          assert.equal(list(),'');
          const p=createSandboxParsers({stage});
          assert.deepEqual(p.pythonSyntax('raise RuntimeError("INERT")'),{parsed:true,line:null});
          assert.equal(p.pythonSyntax('def broken(:').parsed,false);
          assert.equal(list(),'');
          console.log('NERYX_LAUNCHER_PYTHON_OK');
          assert.deepEqual(p.yamlSyntax('--- !ruby/object:NeryxSynthetic\nx: 1'),{parsed:true,line:null});
          assert.equal(p.yamlSyntax('key: [').parsed,false);
          assert.equal(list(),'');
          console.log('NERYX_LAUNCHER_YAML_OK');
          assert.deepEqual(p.ast('sample.mjs','export const x = 1;'),{parsed:true,findings:[]});
          assert.equal(p.ast('sample.mjs','export const = ;').parsed,false);
          assert.ok(p.ast('sample.mjs','eval("synthetic")').findings.some(f=>f.rule==='AST001'));
          assert.equal(list(),'');
          console.log('NERYX_LAUNCHER_ACORN_OK');
          const helper=join(stage,'neryx-python-syntax.py');
          renameSync(helper,helper+'.disabled');
          try {
            assert.throws(()=>p.pythonSyntax('x=1'),/Sandbox parser or cleanup failed/);
            assert.equal(list(),'');
          } finally {renameSync(helper+'.disabled',helper);}
          assert.throws(()=>p.pythonSyntax('x'.repeat(70001)),/Invalid sandbox input/);
          assert.equal(list(),'');
          console.log('NERYX_LAUNCHER_FAILURE_CLEANUP_OK');
          console.log('NERYX_REAL_LAUNCHER_INTEGRATION_OK');
          JS
      - name: Verify public Git acquisition identity contract (no network)
        run: node --test eval/tests/codebrain-public-git.test.mjs
      - name: Verify isolated Git acquisition environment without network
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='buildpack-deps@sha256:7f1df9258f51f0379175ec1c069f66b5b93b4b86c8a2e796a084cfc689262160'
          docker pull --platform linux/amd64 "$image"
          name="neryx-git-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 60s docker run --name "$name" --rm --pull never --platform linux/amd64 \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65534:65534 --memory 256m --memory-swap 256m --cpus 1 --pids-limit 32 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --entrypoint /usr/bin/env "$image" -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME=/tmp/neryx-home \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            GIT_NO_REPLACE_OBJECTS=1 /bin/sh -ec '
              test "$(id -u)" = 65534
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              test "$(ls /sys/class/net)" = lo
              test ! -e /var/run/docker.sock
              test ! -d /home/runner
              test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
              test "$(cat /sys/fs/cgroup/memory.max)" = 268435456
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/pids.max)" = 32
              test "$(cat /sys/fs/cgroup/cpu.max)" = "100000 100000"
              test "$(df -k /tmp | tail -1 | awk "{print \$2}")" = 131072
              if touch /root-probe 2>/dev/null; then exit 1; fi
              mkdir -m 700 "$HOME"
              git -c core.hooksPath=/dev/null init --bare --template= /tmp/repo.git
              test "$(git --git-dir=/tmp/repo.git rev-parse --is-bare-repository)" = true
              test "$(git --git-dir=/tmp/repo.git rev-parse --is-inside-work-tree)" = false
              test ! -e /tmp/repo.git/hooks
              oid="$(printf synthetic | git --git-dir=/tmp/repo.git hash-object -w --stdin)"
              test "$(git --git-dir=/tmp/repo.git cat-file blob "$oid")" = synthetic
              git --git-dir=/tmp/repo.git fsck --strict --no-reflogs
              echo NERYX_GIT_ISOLATED_ENVIRONMENT_OK
            '
          test -z "$(docker ps -a --filter "name=$name" --format '{{.Names}}')"
          echo NERYX_GIT_PROBE_CLEANUP_OK
      - name: Probe pinned public Git refs without REST API or checkout
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        env:
          PROBE_PR: ${{ github.event.pull_request.number }}
          PROBE_HEAD: ${{ github.event.pull_request.head.sha }}
          PROBE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-public-scan.XXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          chmod 755 "$stage"
          cp .github/scripts/{neryx-python-syntax.py,neryx-yaml-syntax.rb} "$stage/"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          STAGE="$stage" node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {randomUUID} from 'node:crypto';
          import {publicGitPlan,publicGitCollector,decodePublicGitCollector,inspectPublicGitCollector} from './eval/tests/codebrain-public-git.mjs';
          import {createSandboxParsers} from './.github/scripts/neryx-sandbox.mjs';
          const plan=publicGitPlan({repo:'y6bkfhyp4d-star/Mein-lernbot',number:Number(process.env.PROBE_PR),head:process.env.PROBE_HEAD,base:process.env.PROBE_BASE});
          const name='neryx-public-git-'+randomUUID();
          const image='buildpack-deps@sha256:7f1df9258f51f0379175ec1c069f66b5b93b4b86c8a2e796a084cfc689262160';
          const invoke=(args,timeout=60000)=>execFileSync('/usr/bin/docker',args,{encoding:'utf8',timeout,killSignal:'SIGKILL',maxBuffer:15000000,stdio:['ignore','pipe','pipe'],env:{PATH:'/usr/bin:/bin',LANG:'C.UTF-8'}});
          let verified=false, payload;
          try {
            const script=[
              'mkdir -m 700 "$HOME"',
              'git -c core.hooksPath=/dev/null init --bare --template= /tmp/repo.git >&2',
              'cd /tmp/repo.git',
              'git "$@" >&2',
              'git --no-replace-objects fsck --strict --no-reflogs >&2',
              publicGitCollector
            ].join('\n');
            const out=invoke(['run','--name',name,'--pull','never','--platform','linux/amd64',
              '--network','bridge','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges:true',
              '--user','65534:65534','--memory','256m','--memory-swap','256m','--cpus','1','--pids-limit','32',
              '--tmpfs','/tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777','--entrypoint','/usr/bin/env',image,
              '-i','PATH=/usr/bin:/bin','LANG=C.UTF-8','HOME=/tmp/neryx-home',
              'GIT_CONFIG_NOSYSTEM=1','GIT_CONFIG_GLOBAL=/dev/null','GIT_TERMINAL_PROMPT=0',
              'GIT_NO_REPLACE_OBJECTS=1','GIT_ASKPASS=/bin/false','/bin/bash','-ec',script,'probe',...plan.fetch]);
            const data=decodePublicGitCollector(plan,out);
            console.log('NERYX_PUBLIC_GIT_TREE_HANDOFF_OK files='+data.files.length);
            payload=out;
            verified=true;
          } catch {
            console.error('NERYX_PUBLIC_GIT_INCOMPLETE: transport, resource or identity check failed');
          } finally {
            invoke(['rm','-f',name],10000);
            const remaining=invoke(['ps','-a','--filter','name='+name,'--format','{{.Names}}'],10000).trim();
            if(remaining)throw Error('Git probe cleanup incomplete');
          }
          if(!verified)process.exitCode=1;
          else {
            console.log('NERYX_PUBLIC_GIT_PINNED_REFS_OK');
            try {
              const data=await inspectPublicGitCollector(plan,payload,{repo:'y6bkfhyp4d-star/Mein-lernbot',number:Number(process.env.PROBE_PR),parsers:createSandboxParsers({stage:process.env.STAGE})});
              console.log('NERYX_PUBLIC_GIT_SCAN scope='+data.scope+' files='+data.result.rows.length+' checked='+data.result.checked+' errors='+data.result.rows.filter(r=>r.status==='error').length+' outcome='+data.outcome);
              if(data.outcome==='INCOMPLETE')process.exitCode=1;
              else console.log('NERYX_PUBLIC_GIT_SCAN_OK');
            } catch { console.error('NERYX_PUBLIC_GIT_SCAN_INCOMPLETE'); process.exitCode=1; }
          }
          JS
