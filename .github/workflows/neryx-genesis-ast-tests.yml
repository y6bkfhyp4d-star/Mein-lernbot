name: GENESIS X AST Analyzer 2.1 tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genesis-ast:
    name: genesis-ast
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated pinned AST parser (no scripts)
        working-directory: eval/genesis-ast
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test AST analysis in read-only mode
        working-directory: eval/genesis-ast
        run: npm test
      - name: AST smoke on existing source (no writeback)
        working-directory: eval/genesis-ast
        run: node analyzer.mjs analyzer.mjs > /dev/null
      - name: Verify OS isolation prerequisites with synthetic probe only
        timeout-minutes: 2
        run: |
          set -euo pipefail
          image='alpine@sha256:9db2934886712d877c932e07249c75a59e6ca27adfbccc05261987a17bef2d63'
          docker pull --platform linux/amd64 "$image"
          name="neryx-isolation-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 30s docker run --name "$name" --rm --pull never --platform linux/amd64 \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
            "$image" /bin/sh -ec '
              test "$(id -u)" = 65534
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              test "$(ls /sys/class/net)" = lo
              test ! -e /var/run/docker.sock
              test ! -d /home/runner
              test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
              if touch /tmp/../isolation-probe 2>/dev/null; then exit 1; fi
              grep -E "^([^ ]+ ){5}ro(,| )" /proc/self/mountinfo | grep -q " / / "
              test "$(cat /sys/fs/cgroup/memory.max)" = 67108864
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/pids.max)" = 16
              test "$(cat /sys/fs/cgroup/cpu.max)" = "50000 100000"
              touch /tmp/isolation-probe
              rm /tmp/isolation-probe
              echo NERYX_SYNTHETIC_ISOLATION_PROBE_OK
            '
      - name: Verify actual Python parser in isolated synthetic cases
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20'
          docker pull --platform linux/amd64 "$image"
          name="neryx-python-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          helper="$PWD/.github/scripts/neryx-python-syntax.py"
          parse() {
            timeout --kill-after=5s 15s docker run -i --name "$name" --rm --pull never --platform linux/amd64 \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --mount "type=bind,source=$helper,target=/parser.py,readonly" \
              --entrypoint /usr/local/bin/python3 "$image" -I -S /parser.py
          }
          test "$(printf 'raise RuntimeError("MUST_NOT_EXECUTE")\n' | parse)" = '{"parsed":true,"line":null}'
          test "$(printf 'def broken(:\n' | parse)" = '{"parsed":false,"line":1}'
          python3 -c 'import sys; sys.stdout.buffer.write(b"x=1\n#"+b"\xc3\xa4"*34997+b" ")' > "$RUNNER_TEMP/neryx-python-boundary.txt"
          test "$(wc -c < "$RUNNER_TEMP/neryx-python-boundary.txt")" = 70000
          test "$(parse < "$RUNNER_TEMP/neryx-python-boundary.txt")" = '{"parsed":true,"line":null}'
          printf ' ' >> "$RUNNER_TEMP/neryx-python-boundary.txt"
          if parse < "$RUNNER_TEMP/neryx-python-boundary.txt" > "$RUNNER_TEMP/neryx-python-rejected.txt" 2>/dev/null; then
            echo 'Oversized parser input unexpectedly accepted' >&2
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/neryx-python-rejected.txt"
          rm -f "$RUNNER_TEMP/neryx-python-boundary.txt" "$RUNNER_TEMP/neryx-python-rejected.txt"
          echo NERYX_ISOLATED_PYTHON_SYNTHETIC_OK
      - name: Verify actual YAML parser in isolated synthetic cases
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image='ruby@sha256:a9ec8f8f22bdcfff3747e9080fedce2b86f487bdec856ca56464ec63603e49c9'
          docker pull --platform linux/amd64 "$image"
          name="neryx-yaml-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          helper="$PWD/.github/scripts/neryx-yaml-syntax.rb"
          parse() {
            timeout --kill-after=5s 15s docker run -i --name "$name" --rm --pull never --platform linux/amd64 \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65534:65534 --memory 64m --memory-swap 64m --cpus 0.5 --pids-limit 16 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1m \
              --mount "type=bind,source=$helper,target=/parser.rb,readonly" \
              --entrypoint /usr/local/bin/ruby "$image" -W0 /parser.rb
          }
          # Label each synthetic case and validate the output contract independently.
          check() {
            local label="$1" expected="$2" result
            if ! result="$(parse)"; then
              echo "YAML probe failed to execute: $label" >&2
              return 1
            fi
            if ! printf '%s' "$result" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert isinstance(data, dict) and set(data) == {"parsed", "line"}
          if sys.argv[1] == "valid":
              assert data["parsed"] is True and data["line"] is None
          else:
              assert data["parsed"] is False and type(data["line"]) is int and data["line"] >= 1
          ' "$expected"; then
              echo "YAML result contract failed: $label" >&2
              return 1
            fi
            echo "YAML probe passed: $label"
          }
          printf 'key: value\n' | check valid-document valid
          printf '%s\n' '--- !ruby/object:NeryxNonexistentSyntheticClass' 'value: 1' | check inert-object-tag valid
          printf 'key: [\n' | check invalid-document invalid
          python3 -c 'import sys; sys.stdout.buffer.write(b"x: 1\n#"+b"\xc3\xa4"*34997)' > "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          test "$(wc -c < "$RUNNER_TEMP/neryx-yaml-boundary.txt")" = 70000
          check exact-byte-boundary valid < "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          printf ' ' >> "$RUNNER_TEMP/neryx-yaml-boundary.txt"
          set +e
          parse < "$RUNNER_TEMP/neryx-yaml-boundary.txt" > "$RUNNER_TEMP/neryx-yaml-rejected.txt" 2>"$RUNNER_TEMP/neryx-yaml-rejected.err"
          rc=$?
          set -e
          echo "YAML oversized-input exit status: $rc"
          test "$rc" = 1
          test ! -s "$RUNNER_TEMP/neryx-yaml-rejected.txt"
          grep -Fq 'input-limit' "$RUNNER_TEMP/neryx-yaml-rejected.err"
          rm -f "$RUNNER_TEMP"/neryx-yaml-boundary.txt "$RUNNER_TEMP"/neryx-yaml-rejected.{txt,err}
          echo NERYX_ISOLATED_YAML_SYNTHETIC_OK
