name: NERYX GENESIS X 1.0 red-first reproduction (expected failures)
on:
  pull_request:
    branches: [neryx/genesis-x-10-research-integration]
    paths:
      - 'eval/tests/genesis-x-10-reproduction.test.mjs'
      - 'docs/GENESIS_X_10_REPRODUCTION_PLAN.md'
      - '.github/workflows/neryx-genesis-x-10-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run red-first original module reproduction (intentionally fails if vulnerabilities exist)
        run: node --test eval/tests/genesis-x-10-reproduction.test.mjs
      - name: Confirm untouched protected files
        if: always() && github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|modules/genesis-x.*\.js|eval/frozen\.seal\.json)$' /tmp/changed.txt; then
            echo "Protected source modified"; exit 1
          fi
