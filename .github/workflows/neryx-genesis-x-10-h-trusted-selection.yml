name: NERYX GENESIS X H trusted selection
on:
  pull_request:
    branches: [neryx/genesis-x-10-final-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Genesis X tests including original, adversarial and H regression
        run: node --test eval/tests/genesis-x*.test.mjs
      - name: Keep production, storage and Frozen untouched
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changes.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json)$' /tmp/changes.txt; then
            echo 'Protected file modified'; exit 1
          fi
