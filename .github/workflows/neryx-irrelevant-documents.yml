name: NERYX irrelevant document fallback
on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/orchestrator.js'
      - 'eval/tests/irrelevant-documents.test.mjs'
      - 'tests/neryx-smoke.test.mjs'
      - '.github/workflows/neryx-irrelevant-documents.yml'
permissions:
  contents: read
jobs:
  document-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test irrelevant, relevant and offline documents
        run: node --test eval/tests/irrelevant-documents.test.mjs
      - name: Verify legacy smoke cases for irrelevant documents and lazy loading
        run: node --test --test-name-pattern="Gesamt-KI: irrelevante gespeicherte Dokumententreffer|Lazy Loading: unbekannte Frage startet Qwen" tests/neryx-smoke.test.mjs
