name: NERYX GENESIS X 1.0 selection truth D repair
on:
  pull_request:
    branches: [neryx/genesis-x-10-fix-sparse-c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All prior GENESIS X regression suites and D tests
        run: node --test eval/tests/genesis-x-core.test.mjs eval/tests/genesis-x-tools.test.mjs eval/tests/genesis-x-tools-adversarial.test.mjs eval/tests/genesis-x-tools-property.test.mjs eval/tests/genesis-x-logic.test.mjs eval/tests/genesis-x-router.test.mjs eval/tests/genesis-x-chain.test.mjs eval/tests/genesis-x-verifier.test.mjs eval/tests/genesis-x-verified-chain.test.mjs eval/tests/genesis-x-diagnostics.test.mjs eval/tests/genesis-x-research.test.mjs eval/tests/genesis-x-research-lab.test.mjs eval/tests/genesis-x-10-dependency-versions.test.mjs eval/tests/genesis-x-10-sparse-c.test.mjs eval/tests/genesis-x-10-truth-d.test.mjs
      - name: Verify fixed original-engine findings A B B2 C D H and controls
        run: node --test eval/tests/genesis-x-10-reproduction.test.mjs
      - name: Ensure production and Frozen stay untouched
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json)$' /tmp/changed.txt; then
            echo "Protected file changed"; exit 1
          fi
