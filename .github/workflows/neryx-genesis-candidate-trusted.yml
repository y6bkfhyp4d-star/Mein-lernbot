# GENESIS X – trusted-base read-only candidate path gate.
# IMPORTANT: pull_request_target loads this workflow from the protected BASE,
# never from a PR head. We do not check out or execute untrusted PR code.
name: NERYX GENESIS X trusted candidate policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  candidate-paths:
    name: genesis-candidate-paths-trusted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check candidate paths via GitHub read-only API (trusted base workflow)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          number = int(os.environ["PR_NUMBER"])
          api = os.environ["API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          root = f"{api}/repos/{repository}/pulls/{number}"

          def get(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "GENESIS-X-readonly-policy"
              })
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          def snapshot():
              pr = get(root)
              if (pr["state"] != "open"
                  or pr["head"]["sha"] != os.environ["EXPECTED_HEAD"]
                  or pr["base"]["sha"] != os.environ["EXPECTED_BASE"]
                  or pr["head"]["ref"] != os.environ["HEAD_REF"]):
                  raise RuntimeError("PR identity changed; rerun required")
              count = pr["changed_files"]
              if type(count) is not int or not 1 <= count <= 3000:
                  raise RuntimeError("Invalid or unsupported PR file count")
              return count

          count = snapshot()
          paths = []
          seen = set()
          for page in range(1, (count + 99) // 100 + 1):
              files = get(f"{root}/files?per_page=100&page={page}")
              if not isinstance(files, list) or len(files) != min(100, count - len(seen)):
                  raise RuntimeError("Incomplete PR file inventory")
              for file in files:
                  path = file["filename"]
                  if not isinstance(path, str) or not path or path in seen:
                      raise RuntimeError("Invalid or duplicate PR filename")
                  seen.add(path)
                  paths.append(path)
                  if file["status"] == "renamed" and not file.get("previous_filename"):
                      raise RuntimeError("Missing rename origin")
                  if "previous_filename" in file:
                      previous = file["previous_filename"]
                      if not isinstance(previous, str) or not previous:
                          raise RuntimeError("Invalid previous filename")
                      paths.append(previous)
          if len(seen) != count or snapshot() != count:
              raise RuntimeError("PR inventory changed; rerun required")

          def sensitive(path):
              return (path.startswith((".github/", "eval/", "docs/NERYX_REVIEWER_"))
                      or path in ("CODEOWNERS", "docs/CODEOWNERS"))

          if os.environ["HEAD_REF"].startswith("neryx/auto/"):
              if any(not p.startswith(("candidates/", "eval/candidates/")) for p in paths):
                  raise RuntimeError("Auto-candidate attempted disallowed path")
              print(f"PASS: {len(paths)} candidate file paths allowed; no PR code executed")
          else:
              critical = sum(sensitive(p) for p in paths)
              print(f"Verified inventory: {count} files; {critical} sensitive path entries")
              if critical:
                  print("::warning::Sensitive changes require independent human review; this gate is inventory only")
              print("Ordinary PR: inventory complete, NOT an independent approval")
          PY
