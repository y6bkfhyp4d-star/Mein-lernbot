name: NERYX - Answer Mode Dummy CI
on:
  push:
    branches:
      - neryx/s2-retrieval-scoring
    paths:
      - 'eval/answer-mode-score.mjs'
      - 'eval/tests/answer-mode-score.test.mjs'
      - '.github/workflows/neryx-answer-mode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  answer-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test answer/abstain preliminary scorer against dummy cases
        run: node --test eval/tests/answer-mode-score.test.mjs
