name: NERYX GENESIS X 1.0 research integration
on:
  pull_request:
    branches: [neryx/genesis-x-09-research-cycle]
    paths:
      - 'modules/genesis-x-research-lab.js'
      - 'eval/tests/genesis-x-research-lab.test.mjs'
      - 'docs/GENESIS_X_RESEARCH_LAB_10.md'
      - '.github/workflows/neryx-genesis-x-10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every isolated Genesis X test
        run: node --test eval/tests/genesis-x-core.test.mjs eval/tests/genesis-x-tools.test.mjs eval/tests/genesis-x-tools-adversarial.test.mjs eval/tests/genesis-x-tools-property.test.mjs eval/tests/genesis-x-logic.test.mjs eval/tests/genesis-x-router.test.mjs eval/tests/genesis-x-chain.test.mjs eval/tests/genesis-x-verifier.test.mjs eval/tests/genesis-x-verified-chain.test.mjs eval/tests/genesis-x-diagnostics.test.mjs eval/tests/genesis-x-research.test.mjs eval/tests/genesis-x-research-lab.test.mjs
      - name: Keep product, earlier modules and Frozen seal untouched
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/genesis10-changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|modules/genesis-x(-tools|-logic|-router|-chain|-verifier|-verified-chain|-diagnostics|-research)?\.js|eval/frozen\.seal\.json)$' /tmp/genesis10-changed.txt; then
            echo "Protected existing file changed"; exit 1
          fi
