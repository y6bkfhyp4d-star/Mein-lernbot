name: LernBot 7.0 – Nachrecherche 7.7 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 2,8,14,20 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase77
  cancel-in-progress: false
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase77
      REPORT_FILES: evolution/phase77/research77.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Gezielte Nachrecherche
        run: python3 evolution/phase77/research77.py
      - name: Tests
        run: python3 -m unittest discover -s evolution/phase77 -p 'test_research77.py'
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
