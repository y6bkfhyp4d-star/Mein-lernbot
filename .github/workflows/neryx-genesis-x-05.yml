name: NERYX GENESIS X 0.5 chained reasoning experiment
on:
  pull_request:
    branches: [neryx/genesis-x-04-router]
    paths:
      - 'modules/genesis-x-chain.js'
      - 'eval/tests/genesis-x-chain.test.mjs'
      - 'docs/GENESIS_X_CHAIN_05.md'
      - '.github/workflows/neryx-genesis-x-05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all isolated Genesis X stages
        run: node --test eval/tests/genesis-x-core.test.mjs eval/tests/genesis-x-tools.test.mjs eval/tests/genesis-x-tools-adversarial.test.mjs eval/tests/genesis-x-tools-property.test.mjs eval/tests/genesis-x-logic.test.mjs eval/tests/genesis-x-router.test.mjs eval/tests/genesis-x-chain.test.mjs
      - name: Verify main app and previous engines unchanged
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|modules/genesis-x(-tools|-logic|-router)?\.js|eval/frozen\.seal\.json)$' /tmp/changed.txt; then
            echo "Protected entrypoint modified"; exit 1
          fi
