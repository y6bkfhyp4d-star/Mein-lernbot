name: NERYX Answer Review Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/neryx-smoke.test.mjs'
      - 'modules/answer-review.js'
      - '.github/workflows/neryx-answer-review-smoke.yml'
permissions:
  contents: read
jobs:
  answer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify answer-review completeness requirements
        run: |
          node --test --test-name-pattern="Antwortkontrolle erkennt angefragte Beispiele, Malerbezug und Schrittabfolge ohne Speicherschreiben" tests/neryx-smoke.test.mjs
