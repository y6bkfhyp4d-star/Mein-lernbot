name: NERYX GENESIS X 1.0 provenance H repair
on:
  pull_request:
    branches: [neryx/genesis-x-10-fix-facade-ab]
    paths:
      - 'modules/genesis-x-chain.js'
      - 'modules/genesis-x-verified-chain.js'
      - 'eval/tests/genesis-x-10-reproduction.test.mjs'
      - 'docs/GENESIS_X_10_FIX_PROVENANCE_H.md'
      - '.github/workflows/neryx-genesis-x-10-fix-h.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all isolated GENESIS X regression suites
        run: node --test eval/tests/genesis-x-core.test.mjs eval/tests/genesis-x-tools.test.mjs eval/tests/genesis-x-tools-adversarial.test.mjs eval/tests/genesis-x-tools-property.test.mjs eval/tests/genesis-x-logic.test.mjs eval/tests/genesis-x-router.test.mjs eval/tests/genesis-x-chain.test.mjs eval/tests/genesis-x-verifier.test.mjs eval/tests/genesis-x-verified-chain.test.mjs eval/tests/genesis-x-diagnostics.test.mjs eval/tests/genesis-x-research.test.mjs eval/tests/genesis-x-research-lab.test.mjs
      - name: Provenance H, fixed A/B, and established green control tests
        run: node --test --test-name-pattern='^(control:|A / RED:|B / RED:|E / characterization:|F / characterization:|G / characterization:|H / FIXED:)' eval/tests/genesis-x-10-reproduction.test.mjs
      - name: Protect production and Frozen
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json)$' /tmp/changed.txt; then
            echo "Protected file changed"; exit 1
          fi
