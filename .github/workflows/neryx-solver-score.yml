name: NERYX - Solver Scorer Dummy CI
on:
  push:
    branches:
      - neryx/s2-retrieval-scoring
    paths:
      - 'eval/solver-score.mjs'
      - 'eval/tests/solver-score.test.mjs'
      - '.github/workflows/neryx-solver-score.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solver-dummy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run solver scoring dummy tests
        run: node --test eval/tests/solver-score.test.mjs
