
name: LernBot 7.0 - Titelabgleich 7.10

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lernbot-phase710.yml"

permissions:
  contents: write

concurrency:
  group: lernbot-phase710
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests fuer sichere Titelzuordnung
        run: python3 -m unittest discover -s evolution/phase710 -p 'test_research710.py'

      - name: Titel und vollstaendige Quellensaetze abgleichen
        run: python3 evolution/phase710/research710.py

      - name: Nur geaenderten Bericht speichern
        run: |
          if ! git diff --quiet -- evolution/phase710/research710.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evolution/phase710/research710.json
            git commit -m "LernBot 7.10: Titelpruefung aktualisieren"
            git pull --rebase
            git push
          else
            echo "Kein neuer Bericht."
          fi
