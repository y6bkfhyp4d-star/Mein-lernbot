name: LernBot 7.0 – Titelabgleich 7.10 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3,9,15,21 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase710
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase710
      REPORT_FILES: evolution/phase710/research710.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Tests fuer sichere Titelzuordnung
        run: python3 -m unittest discover -s evolution/phase710 -p 'test_research710.py'
      - name: Titel und Quellensaetze abgleichen
        run: python3 evolution/phase710/research710.py
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
