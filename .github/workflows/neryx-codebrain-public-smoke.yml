name: NERYX CodeBrain offline gate and optional public API (no secrets)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/neryx-codebrain.mjs'
      - '.github/scripts/neryx-sandbox.mjs'
      - 'eval/tests/codebrain-live-public.test.mjs'
      - 'eval/tests/codebrain.test.mjs'
      - 'eval/tests/codebrain-rate-limit-diagnostics.mjs'
      - 'eval/tests/codebrain-rate-limit-diagnostics.test.mjs'
      - 'eval/tests/codebrain-rate-limit-retry.mjs'
      - 'eval/tests/codebrain-rate-limit-retry.test.mjs'
      - 'eval/tests/codebrain-git-snapshot.mjs'
      - 'eval/tests/codebrain-git-snapshot.test.mjs'
      - '.github/workflows/neryx-codebrain-public-smoke.yml'
permissions: {}
concurrency:
  group: codebrain-public-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  codebrain-public-smoke:
    name: Optional public API diagnostic (quota may be inconclusive)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge for unprivileged smoke test
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Use pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify scanner safeguards offline first
        run: node --test eval/tests/codebrain.test.mjs eval/tests/codebrain-rate-limit-diagnostics.test.mjs eval/tests/codebrain-rate-limit-retry.test.mjs
      - name: Install pinned Acorn parser for public diagnosis
        working-directory: eval/genesis-ast
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned public sandbox images and minimal parser stage
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20
          docker pull --platform linux/amd64 ruby@sha256:a9ec8f8f22bdcfff3747e9080fedce2b86f487bdec856ca56464ec63603e49c9
          docker pull --platform linux/amd64 node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-public.XXXXXX")"
          chmod 755 "$stage"
          cp .github/scripts/{neryx-python-syntax.py,neryx-yaml-syntax.rb} "$stage/"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          printf 'CODEBRAIN_SANDBOX_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Optional live API probe (quota => explicit INCONCLUSIVE, not verified)
        env:
          CODEBRAIN_LIVE_PUBLIC: '1'
          CODEBRAIN_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node --test eval/tests/codebrain-live-public.test.mjs
  codebrain-snapshot-smoke:
    name: Offline snapshot coverage gate (no GitHub API)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR synthetic merge with both parents
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify Ruby YAML parser helper syntax without executing it
        run: ruby -c .github/scripts/neryx-yaml-syntax.rb
      - name: Verify offline snapshot adapter contract
        run: node --test eval/tests/codebrain-git-snapshot.test.mjs
      - name: Install pinned Acorn parser without lifecycle scripts
        working-directory: eval/genesis-ast
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned offline sandbox images and minimal parser stage
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python@sha256:a61cbd76a882645de7f91423329fe43a67eed60d7da24f9e5331414bb3618b20
          docker pull --platform linux/amd64 ruby@sha256:a9ec8f8f22bdcfff3747e9080fedce2b86f487bdec856ca56464ec63603e49c9
          docker pull --platform linux/amd64 node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c
          stage="$(mktemp -d "$RUNNER_TEMP/neryx-snapshot.XXXXXX")"
          chmod 755 "$stage"
          cp .github/scripts/{neryx-python-syntax.py,neryx-yaml-syntax.rb} "$stage/"
          cp eval/genesis-ast/{analyzer.mjs,codebrain-worker.mjs} "$stage/"
          mkdir "$stage/node_modules"
          cp -R eval/genesis-ast/node_modules/acorn "$stage/node_modules/"
          chmod -R a+rX "$stage"
          printf 'CODEBRAIN_SANDBOX_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Inspect local PR merge snapshot without any GitHub API
        env:
          CODEBRAIN_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEBRAIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEBRAIN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node eval/tests/codebrain-git-snapshot.mjs
