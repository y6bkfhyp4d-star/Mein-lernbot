
name: LernBot 7.0 - Faktenextraktion 7.8

on:
  workflow_dispatch: {}
  schedule:
    - cron: "57 2,8,14,20 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lernbot-phase78.yml"

permissions:
  contents: write

concurrency:
  group: lernbot-phase78
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Neue Faktenkandidaten aus passenden Recherchetreffern extrahieren
        run: python3 evolution/phase78/research78.py
      - name: Tests
        run: python3 -m unittest discover -s evolution/phase78 -p 'test_research78.py'
      - name: Extraktionsbericht speichern
        run: |
          if ! git diff --quiet -- evolution/phase78/research78.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evolution/phase78/research78.json
            git commit -m "LernBot 7.8: Extraktionsbericht aktualisieren"
            git pull --rebase
            git push
          else
            echo "Keine Änderungen am Extraktionsbericht."
          fi
