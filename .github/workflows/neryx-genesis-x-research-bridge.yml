name: NERYX GENESIS X controlled research bridge
on:
  pull_request:
    branches: [neryx/genesis-x-10-optional-preview-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check typed research bridge, isolation and fail-closed states
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/neryx-genesis-x-bridge-browser-smoke.mjs
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full NERYX and GENESIS X regression suite
        run: node --test eval/tests/*.test.mjs eval/tests/corpus/*.test.mjs tests/*.test.mjs
  protected-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert production, existing worker and frozen files unchanged
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/research-changes.txt
          if grep -E '^(app\.js|index\.html|sw\.js|manifest\.webmanifest|vercel\.json|eval/frozen\.seal\.json|modules/genesis-x-ambiguity-(client|worker|gate)\.js)$' /tmp/research-changes.txt; then
            echo 'Protected file modified'; exit 1
          fi
