name: LernBot 7.0 – Phase 7 Abschlusspruefung 7.13 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase713
  cancel-in-progress: false
jobs:
  finish-phase7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase713
      REPORT_FILES: evolution/phase713/audit713.json,evolution/phase713/research711.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Synthetische Testfaelle pruefen
        run: python3 -m unittest discover -s evolution/phase713 -p 'test_audit713.py' -v
      - name: Phase 7.11-Bericht uebernehmen
        run: test -f evolution/phase711/research711.json && cp evolution/phase711/research711.json evolution/phase713/research711.json
      - name: Phase 7 abschliessend pruefen
        run: python3 evolution/phase713/audit713.py
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
