name: GENESIS X integrated research preview
on:
  push:
    branches: [neryx/genesis-x-integrated-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser without modifying committed dependencies
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real Worker + mock Qwen model adapter smoke
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/genesis-x-integrated-browser-smoke.mjs
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all old and new Node tests
        run: node --test eval/tests/*.test.mjs eval/tests/corpus/*.test.mjs tests/*.test.mjs
  protected:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Allow only index navigation change; reject sensitive app changes
        run: |
          set -euo pipefail
          git diff --name-only 47f6fca3f3e9ab1e00f32636a21c5cbd9532aa37 HEAD | tee /tmp/changed.txt
          if ! git diff --unified=0 47f6fca3f3e9ab1e00f32636a21c5cbd9532aa37 HEAD -- index.html | grep -F '+    <a class="side-button" id="genesis-x-open"' >/dev/null; then
            echo 'Missing GENESIS X navigation link'; exit 1
          fi
          if grep -E '^(app\\.js|sw\\.js|manifest\\.webmanifest|vercel\\.json|eval/frozen\\.seal\\.json|modules/|evolution/neryx/)' /tmp/changed.txt; then
            echo 'Protected application or model module touched'; exit 1
          fi
