
name: LernBot 7.0 - Wissenspruefung 7.12

on:
  workflow_dispatch: {}
  schedule:
    - cron: "49 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lernbot-phase712.yml"

permissions:
  contents: write

concurrency:
  group: lernbot-phase712
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase 7.11-Pruefbericht uebernehmen
        run: |
          if [ -f evolution/phase711/research711.json ]; then
            cp evolution/phase711/research711.json evolution/phase712/research711.json
          else
            echo "Phase-7.11-Bericht fehlt" >&2
            exit 1
          fi

      - name: Synthetische Qualitaetstests
        run: python3 -m unittest discover -s evolution/phase712 -p 'test_audit712.py'

      - name: Aussagen strukturell pruefen
        run: python3 evolution/phase712/audit712.py

      - name: Pruefbericht speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add evolution/phase712/audit712.json evolution/phase712/research711.json

          if ! git diff --cached --quiet; then
            git commit -m "LernBot 7.12: Pruefbericht aktualisiert"
            git pull --rebase
            git push
          else
            echo "Keine Aenderungen am Pruefbericht."
          fi

