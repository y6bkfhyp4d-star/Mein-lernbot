name: LernBot 7.0 – Wissenspruefung 7.12 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "49 3,9,15,21 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase712
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase712
      REPORT_FILES: evolution/phase712/audit712.json,evolution/phase712/research711.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Phase 7.11-Pruefbericht uebernehmen
        run: test -f evolution/phase711/research711.json && cp evolution/phase711/research711.json evolution/phase712/research711.json
      - name: Synthetische Qualitaetstests
        run: python3 -m unittest discover -s evolution/phase712 -p 'test_audit712.py'
      - name: Aussagen strukturell pruefen
        run: python3 evolution/phase712/audit712.py
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
