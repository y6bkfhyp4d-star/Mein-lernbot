name: LernBot 7.0 – Flexible Satzanalyse 7.11 (Review-Branch)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 3,9,15,21 * * *"
permissions:
  contents: write
concurrency:
  group: lernbot-phase711
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_BRANCH: neryx/research-phase711
      REPORT_FILES: evolution/phase711/research711.json
    steps:
      - name: Geprueften Code aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur zugelassene JSON-Daten aus Review-Branch einlesen
        run: bash .github/scripts/research-review-branch.sh prepare
      - name: Tests fuer Quellenzuordnung
        run: |
          python3 -m unittest discover -s evolution/phase711 -p 'test_research710.py'
          python3 -m unittest discover -s evolution/phase711 -p 'test_research711.py'
      - name: Quellen und Definitionen untersuchen
        run: python3 evolution/phase711/research711.py
      - name: Nur erlaubte JSON-Berichte auf Review-Branch schreiben
        run: bash .github/scripts/research-review-branch.sh publish
