name: GENESIS X opt-in ambiguity worker gate
on:
  pull_request:
    branches: [neryx/genesis-x-10-multistep-ambiguity-gate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check ambiguous and review-only isolated worker behavior
        env:
          NERYX_BROWSER: ${{ matrix.browser }}
        run: node eval/genesis-x-ambiguity-worker-browser-smoke.mjs
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All NERYX / GENESIS X tests
        run: node --test eval/tests/*.test.mjs eval/tests/corpus/*.test.mjs tests/*.test.mjs
      - name: Prior multistep / ambiguity test
        run: node eval/genesis-x-multistep-ambiguity-audit.mjs
  protected-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Block existing app and original worker modifications
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tee /tmp/changed.txt
          if grep -E '^(app\.js|index\.html|sw\.js|eval/frozen\.seal\.json|modules/genesis-x-worker\.js|modules/genesis-x-worker-client\.js)$' /tmp/changed.txt; then
            echo 'Protected existing file changed'; exit 1
          fi
